name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'third_party/**'
      - 'patches/**'
      - 'scripts/apply-patches.sh'
      - '.github/workflows/build-android-apk.yml'
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'android-app/**'
      - 'third_party/**'
      - 'patches/**'
      - 'scripts/apply-patches.sh'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # NDK r28+ links arm64-v8a shared libraries with 16 KiB ELF alignment by
      # default, which Android 15/16 16 KiB-page devices require.
      NDK_VERSION: "28.2.13676358"
      GRADLE_SHA256: "5b9c5eb3f9fc2c94abaea57d90bd78747ca117ddbbf96c859d3741181a12bf2a"
      GRADLE_VERSION: "8.10"
      VULKAN_SDK_VERSION: "1.4.363.0"
      VULKAN_SDK_SHA256: "197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout pinned inference engines
        run: |
          git submodule update --init --depth 1 third_party/llama.cpp third_party/stable-diffusion.cpp
          git -C third_party/stable-diffusion.cpp submodule update --init --depth 1 ggml

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
           packages: ''

      - name: Install SDK components (platform, build-tools, NDK, CMake)
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"

      - name: Install modern host Vulkan SDK (glslc + SPIRV-Headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils build-essential spirv-headers
          mkdir -p "$RUNNER_TEMP/vulkan-sdk"
          curl -fL "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz" \
            -o "$RUNNER_TEMP/vulkan-sdk/vulkan_sdk.tar.xz"
          echo "${VULKAN_SDK_SHA256}  $RUNNER_TEMP/vulkan-sdk/vulkan_sdk.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/vulkan-sdk/vulkan_sdk.tar.xz" -C "$RUNNER_TEMP/vulkan-sdk"
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64" >> "$GITHUB_ENV"
          echo "VULKAN_INCLUDE_DIR=$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/include" >> "$GITHUB_ENV"
          echo "VULKAN_GLSLC_EXECUTABLE=$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/bin/glslc" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64:$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/lib/VulkanLoader" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/bin/glslc" --version

      - name: Apply llama.cpp patches (LittleBit Q1_0 + KleidiAI)
        run: bash scripts/apply-patches.sh

      - name: Install Gradle
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
          echo "${GRADLE_SHA256}  /tmp/gradle.zip" | sha256sum --check
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Prepare distribution signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            umask 077
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/distribution.jks"
            echo "ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/distribution.jks" >> "$GITHUB_ENV"
          fi

      - name: Build optimized release APK
        working-directory: android-app
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          set -o pipefail
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin --gradle-distribution-sha256-sum "$GRADLE_SHA256"
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Summarize Gradle failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle.log"
          [[ -f "$log" ]] || exit 0
          python3 - "$log" <<'PY'
          import sys, urllib.parse
          lines = open(sys.argv[1], errors="replace").read().splitlines()
          marks = [i for i, l in enumerate(lines) if "FAILURE:" in l]
          start = max(0, marks[-1] - 70) if marks else max(0, len(lines) - 120)
          chunk = "\n".join(l.rstrip() for l in lines[start:start + 120])[:6000]
          print("::error title=Gradle failure::" + urllib.parse.quote(chunk, safe=" ,.:;-_()[]{}<>='\"|&%#@!?*+$`/"))
          PY

      - name: Verify offline and standard release APKs (16 KiB ELF pages)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          mkdir -p "$RUNNER_TEMP/apks"
          for edition in offline standard; do
            apk="android-app/app/build/outputs/apk/$edition/release/app-$edition-release.apk"
            echo "::group::Verifying $edition release APK"
            test -f "$apk"
            unzip -t "$apk" > /dev/null
            echo "zipalign: $(basename "$apk")"
            "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
            "$build_tools/apksigner" verify --verbose "$apk"
            "$build_tools/aapt2" dump badging "$apk" | grep -E "^(package|native-code):"
            "$build_tools/aapt2" dump badging "$apk" | grep -q "native-code: 'arm64-v8a'"
            unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libsd_jni.so'
            unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libllama_jni.so'
            rm -rf "$RUNNER_TEMP/apks/$edition-libs"
            unzip -q "$apk" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/apks/$edition-libs"
            mapfile -t libs < <(find "$RUNNER_TEMP/apks/$edition-libs" -name '*.so' -print | sort)
            test "${#libs[@]}" -gt 0
            for lib in "${libs[@]}"; do
              "$readelf" -lW "$lib" | grep -q ' LOAD ' || {
                echo "::error::$edition $(basename "$lib") has no ELF LOAD segments"
                exit 1
              }
              while read -r align; do
                (( align >= 16384 )) || {
                  echo "::error::$edition $(basename "$lib") LOAD alignment $align is below 16 KiB"
                  exit 1
                }
              done < <("$readelf" -lW "$lib" | awk '$1 == "LOAD" { print $NF }' | sort -u)
              echo "16 KiB ELF pages OK: $(basename "$lib")"
            done
            cp "$apk" "$RUNNER_TEMP/apks/littlebit-chat-$edition-arm64.apk"
            echo "::endgroup::"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-apk
          path: ${{ runner.temp }}/apks/*.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-release-apk
      - name: Prepare release assets
        run: |
          for edition in offline standard; do
            name="littlebit-chat-${GITHUB_REF_NAME}-$edition-arm64.apk"
            mv "littlebit-chat-$edition-arm64.apk" "$name"
            sha256sum "$name" > "$name.sha256"
          done
      - name: Attach signed APK
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: LittleBit Chat ${{ github.ref_name }}
          body: |
            Choose Offline for zero network permission, or Standard for optional per-message web search.
            Both editions ship 16 KiB ELF-aligned arm64 libraries (NDK r28c) for Android 15-16 devices.
            Includes Image Studio, direct GGUF loading, RAM estimates, backend comparison, chat forks, and Android text actions.
            Download the APK below to sideload. The matching .sha256 file verifies the download.
          files: |
            littlebit-chat-*-arm64.apk
            littlebit-chat-*-arm64.apk.sha256
          fail_on_unmatched_files: true
